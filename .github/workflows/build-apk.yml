name: Build Plosbi Social APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extrair projeto ZIP
        run: |
          mkdir -p _source
          ZIP_FILE=$(ls Plosbi_Social_APK_Ready_*.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi
          echo "Usando: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d _source
          PROJECT_DIR=$(dirname "$(find _source -name package.json -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "_source" ]; then
            echo "package.json nao encontrado dentro do ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias e compilar
        env:
          VITE_SUPABASE_URL: https://tesynwdsrmhfpmttffjf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_LoLSGreOvG0KTRkP53K5fg_S0xZKVsO
          VITE_SITE_URL: https://oaleatoriovkzin.github.io/plosbi-social/
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build

      - name: Preparar projeto Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          f = '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="com.plosbi.social" android:host="auth-callback" />
            </intent-filter>
          </activity>'''
          assert 'auth-callback' not in s
          s = s.replace('</activity>', f, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: plosbi-social-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
